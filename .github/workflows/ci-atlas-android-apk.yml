name: RAFAELIA Atlas Wizard - build signed debug APK arm32+arm64

on:
  pull_request:
    paths:
      - 'android/atlas_wizard/**'
      - '.github/workflows/ci-atlas-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-wizard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR HEAD without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Build real APK using the preinstalled Android SDK and NDK
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          bash android/atlas_wizard/ci/build_apk.sh
          printf 'Source SHA: %s\n' "$EXPECTED_SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Output = debug APK only; Android device and remote Drive not tested.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish only debug APK and receipt, never keystore
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: RAFAELIA-Atlas-Wizard-arm32-arm64-debug
          path: |
            android/atlas_wizard/out/RAFAELIA-Atlas-Wizard-arm32-arm64-debug.apk
            android/atlas_wizard/out/RAFAELIA-Atlas-Wizard-arm32-arm64-debug.apk.receipt.json
          if-no-files-found: error
          retention-days: 14
