name: Evidence Registry

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public evidence
        run: python3 evidence-registry/collector.py --sources evidence-registry/sources.txt --out evidence
      - name: Upload immutable run artifact
        uses: actions/upload-artifact@v4
        with:
          name: evidence-registry-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
