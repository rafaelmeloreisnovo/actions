# RAFAELIA: split network collection (read-only) from Git mutation (write-only job).
# External source material is data, never trusted code or a release/claim receipt.
name: Evidence Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'evidence-registry/**'
      - '.github/workflows/evidence-registry.yml'
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: evidence-registry
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - name: Checkout immutable source without persisted token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate policy and offline negative fixtures
        shell: bash
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          python3 -m unittest discover -s evidence-registry/tests -p 'test_*.py' -v
      - name: Collect public evidence without publish credential
        shell: bash
        run: bash evidence-registry/collect.sh evidence-registry/sources.tsv evidence-artifact
      - name: Upload raw evidence artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: evidence-registry-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence-artifact/
          if-no-files-found: error
          retention-days: 90

  publish-ledger:
    # Human merge authority remains external. This does not write on feature PRs.
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: [collect]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    # This job can write only a new evidence review branch.
    # Pull request publication permission never implies merge authority.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout exact authorized main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Download collector's same-run immutable artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: evidence-registry-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence-artifact
      - name: Verify custody and prepare review-only branch
        shell: bash
        env:
          EXPECTED: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          run_key="$(cat evidence-artifact/LATEST_RUN)"
          [[ "$run_key" =~ ^[0-9]+-[0-9]+-[0-9]{8}T[0-9]{6}Z$ ]] || exit 2
          test -f "evidence-artifact/runs/$run_key/SHA256SUMS"
          sha256sum -c "evidence-artifact/runs/$run_key/SHA256SUMS"
          test -f evidence-artifact/latest-ledger.jsonl
          test -f evidence-artifact/latest-SHA256SUMS
          cmp "evidence-artifact/runs/$run_key/ledger.jsonl" evidence-artifact/latest-ledger.jsonl
          cmp "evidence-artifact/runs/$run_key/SHA256SUMS" evidence-artifact/latest-SHA256SUMS
          mkdir -p evidence-ledger
          cp evidence-artifact/latest-ledger.jsonl "evidence-ledger/$run_key.jsonl"
          cp evidence-artifact/latest-SHA256SUMS "evidence-ledger/$run_key.SHA256SUMS"
          git config user.name "evidence-registry[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "evidence-ledger/$run_key.jsonl" "evidence-ledger/$run_key.SHA256SUMS"
          if git diff --cached --quiet; then
            echo "No new captured content"
            exit 0
          fi
          git commit -m "evidence: capture $run_key"
          # Unique immutable run identifier: NEVER push directly into main,
          # force-push, merge, delete a branch, or auto-promote a claim.
          branch="evidence/review-$run_key"
          git push origin "HEAD:refs/heads/$branch"
          echo "evidence_candidate_branch=$branch" >> "$GITHUB_STEP_SUMMARY"
          # This may be forbidden by provider governance. On failure the
          # candidate branch remains available for manual review.
          command -v gh >/dev/null
          gh pr create --draft --base main --head "$branch" \
            --title "evidence: review $run_key" \
            --body "Source HEAD: $EXPECTED. Artifact: evidence-registry-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT. SHA256 verified relative to collector. NO source claims or automatic merge; reviewer must authorize each promotion."
          echo "NO_AUTOMATIC_MERGE=true" >> "$GITHUB_STEP_SUMMARY"
