name: Evidence Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'evidence-registry/**'
      - '.github/workflows/evidence-registry.yml'
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write

concurrency:
  group: evidence-registry
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect public evidence with Bash
        shell: bash
        run: bash evidence-registry/collect.sh evidence-registry/sources.tsv evidence-artifact

      - name: Upload raw evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: evidence-registry-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence-artifact/
          if-no-files-found: error
          retention-days: 90

      - name: Commit ledger and manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-ledger
          run_key="$(cat evidence-artifact/LATEST_RUN)"
          cp evidence-artifact/latest-ledger.jsonl "evidence-ledger/${run_key}.jsonl"
          cp evidence-artifact/latest-SHA256SUMS "evidence-ledger/${run_key}.SHA256SUMS"
          git config user.name "evidence-registry[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence-ledger/
          if git diff --cached --quiet; then
            echo "No documentary delta"
            exit 0
          fi
          git commit -m "evidence: capture ${run_key}"
          git push
